name: Build and Publish .NET AOT Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Manually set the version (e.g., 1.2.3).'
        required: true

permissions:
  contents: write

jobs:
  version-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Create Release and Save Build Version
        id: create_release
        env:
          TAG_NAME: ${{ github.event.inputs.version }}
          RELEASE_NAME: transcribe-${{ github.event.inputs.version }}
          REPO_FULL_NAME: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${TAG_NAME:-}" ]]; then
            echo "Input 'version' is required"; exit 1
          fi

          payload=$(jq -n --arg tag "$TAG_NAME" --arg name "$RELEASE_NAME" \
            '{ tag_name: $tag, name: $name, prerelease: false }')

          resp_file=$(mktemp)
          status=$(curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -o "$resp_file" -w "%{http_code}" \
            "https://api.github.com/repos/${REPO_FULL_NAME}/releases" \
            -d "$payload" || true)

          # If the release for this tag already exists, fetch it instead
          if [[ "$status" == "422" ]]; then
            rm -f "$resp_file"
            resp_file=$(mktemp)
            status=$(curl -sS -X GET \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "$resp_file" -w "%{http_code}" \
              "https://api.github.com/repos/${REPO_FULL_NAME}/releases/tags/${TAG_NAME}" || true)
          fi

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "GitHub API failed with HTTP $status:"
            cat "$resp_file"
            exit 1
          fi

          upload_url=$(jq -er '.upload_url' < "$resp_file") || {
            echo "Response missing upload_url:"; cat "$resp_file"; exit 1; }

          echo "${TAG_NAME}~${upload_url}" > version.txt
          echo "version.txt: $(cat version.txt)"

      - name: Upload version artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: cli_version
          path: version.txt

  windows-build:
    needs:  version-control 
    runs-on: windows-latest
    steps:
    
    - name: Retrieve version tag
      uses: actions/download-artifact@v5.0.0
      with:
        name: cli_version
    - run: |
        version=`cut version.txt -d '~' -f 1`
        release_url=`cut version.txt -d '~' -f 2`
        echo "CLI_RELEASE=$version" >> $GITHUB_ENV
        echo "CLI_RELEASE_URL=$release_url" >> $GITHUB_ENV
      shell: bash    
    
    - name: Checkout Code
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0
        
    - name: Setup .NET      
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'
          
    - name: Build and publish for AOT
      run: dotnet publish transcribe --configuration Release --self-contained true --runtime win-x64 /p:PublishSingleFile=true /p:PublishTrimmed=true /p:Version=${{env.CLI_RELEASE}} -o ./published/win-x64
          
    - name: Zip Artifact
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/win-x64/
        recursive: true
        dest: transcribe-${{env.CLI_RELEASE}}-winx64.zip
    
    - name: Upload a Release Asset
      id: upload-release-asset
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     
      with:
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-${{env.CLI_RELEASE}}-winx64.zip
        asset_name: transcribe-${{env.CLI_RELEASE}}-winx64.zip
        asset_content_type: application/zip  

  linux-build:
    needs:  [version-control]
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0
        
    - name: Setup .NET      
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Retrieve version tag
      uses: actions/download-artifact@v5.0.0
      with:
        name: cli_version
    - run: |
        version=`cut version.txt -d '~' -f 1`
        release_url=`cut version.txt -d '~' -f 2`
        echo "CLI_RELEASE=$version" >> $GITHUB_ENV
        echo "CLI_RELEASE_URL=$release_url" >> $GITHUB_ENV
          
    - name: Build Project
      run: dotnet publish transcribe --configuration Release --self-contained true --runtime linux-x64 /p:PublishSingleFile=true /p:PublishTrimmed=true /p:Version=${{env.CLI_RELEASE}} -o ./published/linux-x64
          
    - name: Zip Artifact
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/linux-x64/
        recursive: true
        dest: transcribe-${{env.CLI_RELEASE}}-linux-x64.zip                             
    
    - name: Upload a Release Asset
      id: upload-release-asset
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     
      with:
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-${{env.CLI_RELEASE}}-linux-x64.zip
        asset_name: transcribe-${{env.CLI_RELEASE}}-linux-x64.zip
        asset_content_type: application/zip  

  osx-build:
    needs:  [version-control]
    runs-on: macOS-latest
    steps:
    
    - name: Retrieve version tag
      uses: actions/download-artifact@v5.0.0
      with:
        name: cli_version
    - run: |
        brew install coreutils
        version=`gcut version.txt -d '~' -f 1`
        release_url=`gcut version.txt -d '~' -f 2`
        echo "CLI_RELEASE=$version" >> $GITHUB_ENV
        echo "CLI_RELEASE_URL=$release_url" >> $GITHUB_ENV   
    
    - name: Checkout Code
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0
        
    - name: Setup .NET      
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'    
       
    - name: Build Project
      run: dotnet publish transcribe --configuration Release --self-contained true --runtime osx-arm64 /p:PublishSingleFile=true /p:PublishTrimmed=true /p:Version=${{env.CLI_RELEASE}} -o ./published/osx-arm64
            
    - name: Zip Artifact
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/osx-arm64/
        recursive: true
        dest: transcribe-${{env.CLI_RELEASE}}-osx-arm64.zip          
    
    - name: Upload a Release Asset
      id: upload-release-asset
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     
      with:
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-${{env.CLI_RELEASE}}-osx-arm64.zip
        asset_name: transcribe-${{env.CLI_RELEASE}}-osx-arm64.zip
        asset_content_type: application/zip  
