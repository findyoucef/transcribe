name: Build and Publish .NET GUI Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Manually set the version (e.g., 1.2.3).'
        required: true

permissions:
  contents: write

env:
  RELEASES_REPO: youcefnb/transcribe-releases
  RELEASES_REPO_DEFAULT_BRANCH: main

jobs:
  version-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Create Release and Save Build Version
        id: create_release
        env:
          TAG_NAME: ${{ github.event.inputs.version }}
          RELEASE_NAME: transcribe-${{ github.event.inputs.version }}
          RELEASES_REPO: ${{ env.RELEASES_REPO }}
          TARGET_COMMITISH: ${{ env.RELEASES_REPO_DEFAULT_BRANCH }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${TAG_NAME:-}" ]]; then
            echo "Input 'version' is required"; exit 1
          fi
          if [[ -z "${RELEASES_REPO:-}" ]]; then
            echo "RELEASES_REPO is required"; exit 1
          fi
          if [[ -z "${TARGET_COMMITISH:-}" ]]; then
            echo "RELEASES_REPO_DEFAULT_BRANCH is required"; exit 1
          fi
          if [[ -z "${RELEASES_TOKEN:-}" ]]; then
            echo "Missing RELEASES_REPO_TOKEN secret"; exit 1
          fi

          payload=$(jq -n --arg tag "$TAG_NAME" --arg name "$RELEASE_NAME" --arg target "$TARGET_COMMITISH" \
            '{ tag_name: $tag, name: $name, target_commitish: $target, prerelease: false }')

          resp_file=$(mktemp)
          status=$(curl -sS -X POST \
            -H "Authorization: Bearer ${RELEASES_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -o "$resp_file" -w "%{http_code}" \
            "https://api.github.com/repos/${RELEASES_REPO}/releases" \
            -d "$payload" || true)

          # If the release for this tag already exists, fetch it instead
          if [[ "$status" == "422" ]]; then
            if ! jq -e '.errors[]? | select(.code=="already_exists" and .field=="tag_name")' "$resp_file" > /dev/null; then
              echo "Release creation failed:"
              cat "$resp_file"
              exit 1
            fi
            rm -f "$resp_file"
            resp_file=$(mktemp)
            status=$(curl -sS -X GET \
              -H "Authorization: Bearer ${RELEASES_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "$resp_file" -w "%{http_code}" \
              "https://api.github.com/repos/${RELEASES_REPO}/releases/tags/${TAG_NAME}" || true)
          fi

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "GitHub API failed with HTTP $status:"
            cat "$resp_file"
            exit 1
          fi

          upload_url=$(jq -er '.upload_url' < "$resp_file") || {
            echo "Response missing upload_url:"; cat "$resp_file"; exit 1; }

          echo "${TAG_NAME}~${upload_url}" > version.txt
          echo "version.txt: $(cat version.txt)"

      - name: Upload version artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: cli_version
          path: version.txt

  windows-build:
    needs:  version-control 
    runs-on: windows-latest
    steps:
    
    - name: Retrieve version tag
      uses: actions/download-artifact@v5.0.0
      with:
        name: cli_version
    - run: |
        version=`cut version.txt -d '~' -f 1`
        release_url=`cut version.txt -d '~' -f 2`
        echo "CLI_RELEASE=$version" >> $GITHUB_ENV
        echo "CLI_RELEASE_URL=$release_url" >> $GITHUB_ENV
      shell: bash    
    
    - name: Checkout Code
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0

    - name: Download diarization model
      shell: bash
      env:
        DIARIZATION_MODEL_URL: https://wespeaker-1256283475.cos.ap-shanghai.myqcloud.com/models/voxceleb/voxceleb_resnet293_LM.onnx
      run: |
        set -euo pipefail
        model_dir="transcribe/models"
        model_path="${model_dir}/voxceleb_resnet293_LM.onnx"
        if [[ ! -f "${model_path}" ]]; then
          mkdir -p "${model_dir}"
          echo "Downloading diarization model..."
          curl -L "${DIARIZATION_MODEL_URL}" -o "${model_path}"
        fi
        
    - name: Setup .NET      
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'
          
    - name: Build and publish GUI
      run: dotnet publish transcribe.gui --configuration Release --self-contained true --runtime win-x64 /p:PublishSingleFile=true /p:PublishTrimmed=false /p:Version=${{env.CLI_RELEASE}} -o ./published/win-x64
          
    - name: Zip Artifact
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/win-x64/
        recursive: true
        dest: transcribe-${{env.CLI_RELEASE}}-winx64.zip
    
    - name: Upload a Release Asset
      id: upload-release-asset
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      with:
        github_token: ${{ secrets.RELEASES_REPO_TOKEN }}
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-${{env.CLI_RELEASE}}-winx64.zip
        asset_name: transcribe-${{env.CLI_RELEASE}}-winx64.zip
        asset_content_type: application/zip  

    - name: Build and publish CLI
      run: dotnet publish transcribe --configuration Release --self-contained true --runtime win-x64 /p:PublishSingleFile=true /p:PublishTrimmed=false /p:Version=${{env.CLI_RELEASE}} -o ./published/win-x64-cli

    - name: Zip Artifact CLI
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/win-x64-cli/
        recursive: true
        dest: transcribe-cli-${{env.CLI_RELEASE}}-winx64.zip

    - name: Upload CLI Release Asset
      id: upload-release-asset-cli
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      with:
        github_token: ${{ secrets.RELEASES_REPO_TOKEN }}
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-cli-${{env.CLI_RELEASE}}-winx64.zip
        asset_name: transcribe-cli-${{env.CLI_RELEASE}}-winx64.zip
        asset_content_type: application/zip          

  linux-build:
    needs:  [version-control]
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0

    - name: Download diarization model
      shell: bash
      env:
        DIARIZATION_MODEL_URL: https://wespeaker-1256283475.cos.ap-shanghai.myqcloud.com/models/voxceleb/voxceleb_resnet293_LM.onnx
      run: |
        set -euo pipefail
        model_dir="transcribe/models"
        model_path="${model_dir}/voxceleb_resnet293_LM.onnx"
        if [[ ! -f "${model_path}" ]]; then
          mkdir -p "${model_dir}"
          echo "Downloading diarization model..."
          curl -L "${DIARIZATION_MODEL_URL}" -o "${model_path}"
        fi
        
    - name: Setup .NET      
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Retrieve version tag
      uses: actions/download-artifact@v5.0.0
      with:
        name: cli_version
    - run: |
        version=`cut version.txt -d '~' -f 1`
        release_url=`cut version.txt -d '~' -f 2`
        echo "CLI_RELEASE=$version" >> $GITHUB_ENV
        echo "CLI_RELEASE_URL=$release_url" >> $GITHUB_ENV
          
    - name: Build GUI
      run: dotnet publish transcribe.gui --configuration Release --self-contained true --runtime linux-x64 /p:PublishSingleFile=true /p:PublishTrimmed=false /p:Version=${{env.CLI_RELEASE}} -o ./published/linux-x64
          
    - name: Zip Artifact
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/linux-x64/
        recursive: true
        dest: transcribe-${{env.CLI_RELEASE}}-linux-x64.zip                             
    
    - name: Upload a Release Asset
      id: upload-release-asset
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      with:
        github_token: ${{ secrets.RELEASES_REPO_TOKEN }}
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-${{env.CLI_RELEASE}}-linux-x64.zip
        asset_name: transcribe-${{env.CLI_RELEASE}}-linux-x64.zip
        asset_content_type: application/zip

    - name: Build and publish CLI
      run: dotnet publish transcribe --configuration Release --self-contained true --runtime linux-x64 /p:PublishSingleFile=true /p:PublishTrimmed=false /p:Version=${{env.CLI_RELEASE}} -o ./published/linux-x64-cli

    - name: Zip Artifact CLI
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/linux-x64-cli
        recursive: true
        dest: transcribe-cli-${{env.CLI_RELEASE}}-linux-x64.zip

    - name: Upload CLI Release Asset
      id: upload-release-asset-cli
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      with:
        github_token: ${{ secrets.RELEASES_REPO_TOKEN }}
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-cli-${{env.CLI_RELEASE}}-linux-x64.zip
        asset_name: transcribe-cli-${{env.CLI_RELEASE}}-linux-x64.zip
        asset_content_type: application/zip         

  osx-build:
    needs:  [version-control]
    runs-on: macOS-latest
    steps:
    
    - name: Retrieve version tag
      uses: actions/download-artifact@v5.0.0
      with:
        name: cli_version
    - run: |
        brew install coreutils
        version=`gcut version.txt -d '~' -f 1`
        release_url=`gcut version.txt -d '~' -f 2`
        echo "CLI_RELEASE=$version" >> $GITHUB_ENV
        echo "CLI_RELEASE_URL=$release_url" >> $GITHUB_ENV   
    
    - name: Checkout Code
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0

    - name: Download diarization model
      shell: bash
      env:
        DIARIZATION_MODEL_URL: https://wespeaker-1256283475.cos.ap-shanghai.myqcloud.com/models/voxceleb/voxceleb_resnet293_LM.onnx
      run: |
        set -euo pipefail
        model_dir="transcribe/models"
        model_path="${model_dir}/voxceleb_resnet293_LM.onnx"
        if [[ ! -f "${model_path}" ]]; then
          mkdir -p "${model_dir}"
          echo "Downloading diarization model..."
          curl -L "${DIARIZATION_MODEL_URL}" -o "${model_path}"
        fi
        
    - name: Setup .NET      
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'    
       
    - name: Build GUI
      run: dotnet publish transcribe.gui --configuration Release --self-contained true --runtime osx-arm64 /p:PublishSingleFile=true /p:PublishTrimmed=false /p:Version=${{env.CLI_RELEASE}} -o ./published/osx-arm64
            
    - name: Zip Artifact
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/osx-arm64/
        recursive: true
        dest: transcribe-${{env.CLI_RELEASE}}-osx-arm64.zip          
    
    - name: Upload a Release Asset
      id: upload-release-asset
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      with:
        github_token: ${{ secrets.RELEASES_REPO_TOKEN }}
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-${{env.CLI_RELEASE}}-osx-arm64.zip
        asset_name: transcribe-${{env.CLI_RELEASE}}-osx-arm64.zip
        asset_content_type: application/zip

    - name: Build and publish CLI
      run: dotnet publish transcribe --configuration Release --self-contained true --runtime osx-arm64 /p:PublishSingleFile=true /p:PublishTrimmed=false /p:Version=${{env.CLI_RELEASE}} -o ./published/osx-arm64-cli

    - name: Zip Artifact CLI
      uses: vimtor/action-zip@v1.1
      with:
        files: ./published/osx-arm64-cli/
        recursive: true
        dest: transcribe-cli-${{env.CLI_RELEASE}}-osx-arm64.zip

    - name: Upload CLI Release Asset
      id: upload-release-asset-cli
      uses: shogo82148/actions-upload-release-asset@v1.7.2
      with:
        github_token: ${{ secrets.RELEASES_REPO_TOKEN }}
        upload_url: ${{env.CLI_RELEASE_URL}}
        asset_path: transcribe-cli-${{env.CLI_RELEASE}}-osx-arm64.zip 
        asset_name: transcribe-cli-${{env.CLI_RELEASE}}-osx-arm64.zip 
        asset_content_type: application/zip         
